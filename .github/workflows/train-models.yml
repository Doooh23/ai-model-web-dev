name: 모델 사전 학습

# 브라우저에서 돌릴 수 없는 무거운 모델(LSTM·GRU·TCN·Transformer·EGARCH·HMM)을
# 여기서 미리 학습해 docs/data/predictions.json 으로 내보냅니다.
#
# 매일 돌리지 않는 이유: torch 설치와 학습에 시간이 오래 걸리는데, 하루치 데이터가
# 늘었다고 딥러닝 모델의 예측이 눈에 띄게 달라지지는 않기 때문입니다.
# 시장 데이터는 매일(update-market-data.yml), 모델은 주 1회 갱신합니다.
on:
  schedule:
    - cron: "0 3 * * 0"          # 매주 일요일 UTC 03:00
  workflow_dispatch:
    inputs:
      tickers:
        description: "학습할 종목 (공백으로 구분)"
        required: false
        default: "AAPL MSFT NVDA GOOGL TSLA"
      epochs:
        description: "딥러닝 학습 에폭 수"
        required: false
        default: "20"
      skip_deep:
        description: "딥러닝 건너뛰기 (true/false) — EGARCH·HMM만 돌립니다"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: train-models
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 필요한 것 설치
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          if [ "${{ github.event.inputs.skip_deep }}" != "true" ]; then
            # CPU 전용 빌드로 설치합니다(기본 빌드는 CUDA까지 받아 와 훨씬 큽니다)
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: 데이터 확인
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("docs/data/daily.json")
          if not p.exists():
              sys.exit("daily.json 이 없습니다 — 먼저 시장 데이터 자동 갱신을 돌리세요.")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"일봉 {len(d['dates'])}일 · 종목 {len(d['tickers'])}개")
          PY

      - name: 사전 학습
        run: |
          ARGS="--tickers ${{ github.event.inputs.tickers || 'AAPL MSFT NVDA GOOGL TSLA' }}"
          ARGS="$ARGS --epochs ${{ github.event.inputs.epochs || '20' }}"
          if [ "${{ github.event.inputs.skip_deep }}" = "true" ]; then
            ARGS="$ARGS --skip-deep"
          fi
          python -m pipeline.train_models $ARGS

      - name: 피처 일치 검사용 표본 갱신
        run: python -m pipeline.check_parity

      - name: 결과 확인
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("docs/data/predictions.json")
          if not p.exists():
              sys.exit("predictions.json 이 만들어지지 않았습니다.")
          d = json.loads(p.read_text(encoding="utf-8"))
          models = d.get("models", {})
          if not models:
              sys.exit("예측이 하나도 없습니다.")
          for mid, m in models.items():
              n = sum(len(v["v"]) for v in m["pred"].values())
              print(f"  {mid:<12} {m['task']:<11} 종목 {len(m['pred'])}개 · {n:,}일")
          PY

      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/predictions.json docs/data/parity_check.json
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            STAMP=$(python -c "import json;print(json.load(open('docs/data/predictions.json'))['generated'])")
            git commit -m "모델 사전 학습 갱신 ($STAMP)"
            git push
          fi
