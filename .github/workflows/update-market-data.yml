name: 시장 데이터 자동 갱신

# 미국 증시는 한국시간 새벽에 끝납니다(서머타임에 따라 05:00 또는 06:00).
# 넉넉하게 UTC 22:30(한국시간 07:30)에 돌려서 그날 종가를 확실히 받습니다.
on:
  schedule:
    - cron: "30 22 * * 1-5"     # 월~금, UTC 22:30
  workflow_dispatch:            # 필요할 때 손으로도 실행할 수 있게
    inputs:
      years:
        description: "받을 일봉 기간(년)"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 필요한 것 설치
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: 데이터 받기
        id: fetch
        run: |
          python -m pipeline.fetch_market --years "${{ github.event.inputs.years || '12' }}"

      - name: 받은 내용 확인
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("docs/data/meta.json")
          if not p.exists():
              sys.exit("meta.json 이 없습니다 — 수집이 실패했습니다.")
          meta = json.loads(p.read_text(encoding="utf-8"))
          print(f"종목 {meta['n_tickers']}개 · {meta['first_date']} ~ {meta['last_date']}")
          if meta.get("synthetic"):
              sys.exit("가상 데이터가 만들어졌습니다 — 실데이터 수집이 실패한 것입니다.")
          if meta["n_tickers"] < 50:
              sys.exit(f"종목이 너무 적습니다({meta['n_tickers']}개). 수집에 문제가 있습니다.")
          PY

      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            LAST=$(python -c "import json;print(json.load(open('docs/data/meta.json'))['last_date'])")
            git commit -m "시장 데이터 갱신 ($LAST)"
            git push
          fi
