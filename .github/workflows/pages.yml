name: 사이트 배포 (GitHub Pages)

# docs/ 폴더를 그대로 GitHub Pages 로 올립니다.
# 빌드 도구가 없는 순수 정적 사이트라 따로 컴파일할 것이 없습니다.
#
# 데이터 갱신(update-market-data.yml)이나 모델 사전 학습(train-models.yml)이
# docs/data/*.json 을 커밋하면 그 push 로 이 워크플로가 다시 돌아 사이트가 갱신됩니다.
#
# ※ 처음 한 번은 사람이 Pages 를 켜 줘야 합니다.
#   워크플로 토큰(GITHUB_TOKEN)에는 저장소 설정을 바꿀 권한이 없어서, 이 워크플로가
#   Pages 자체를 켤 수는 없습니다. 아래 '설정 확인' 단계가 그 사실을 알려 줍니다.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

  # ★ 데이터 갱신·모델 학습 워크플로가 끝나면 이어서 배포합니다.
  #
  #   이게 왜 필요한가: 그 워크플로들이 docs/data/*.json 을 커밋하지만, 그 push 는
  #   위의 push 트리거를 **작동시키지 못합니다**. GitHub 은 워크플로 토큰
  #   (GITHUB_TOKEN)으로 만든 push 로는 다른 워크플로를 트리거하지 않습니다.
  #   워크플로가 서로를 끝없이 부르는 사고를 막으려는 안전장치입니다.
  #   그래서 push 대신 "그 워크플로가 끝났다"는 신호를 직접 받습니다.
  workflow_run:
    workflows: ["시장 데이터 자동 갱신", "모델 사전 학습"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 취소하지 않습니다(중간 상태로 남을 수 있어서).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 앞선 워크플로가 실패했으면 배포하지 않습니다(workflow_run 은 실패해도 옵니다).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          # workflow_run 으로 불려 왔을 때는 "그 워크플로가 시작된 시점"의 커밋이
          # 기본값이라, 그 워크플로가 방금 만든 데이터 커밋이 빠집니다.
          # 항상 main 의 최신을 올리도록 못 박아 둡니다.
          ref: main

      - name: 올릴 내용 확인
        run: |
          python - <<'PY'
          import json, pathlib, sys
          need = ["index.html", "css/style.css", "data/daily.json", "data/meta.json"]
          docs = pathlib.Path("docs")
          missing = [n for n in need if not (docs / n).exists()]
          if missing:
              sys.exit("필수 파일이 없습니다: " + ", ".join(missing))
          meta = json.loads((docs / "data" / "meta.json").read_text(encoding="utf-8"))
          print(f"데이터 {meta['n_days']}일 · 종목 {meta['n_tickers']}개 · 갱신 {meta['updated']}")
          pred = docs / "data" / "predictions.json"
          if pred.exists():
              p = json.loads(pred.read_text(encoding="utf-8"))
              print("사전 학습 모델:", ", ".join(p.get("models", {})))
          else:
              print("사전 학습 결과 없음 (사이트는 브라우저 모델만으로 동작합니다)")
          total = sum(f.stat().st_size for f in docs.rglob("*") if f.is_file())
          print(f"올릴 용량 {total/1024/1024:.1f} MB")
          PY

      # Pages 가 꺼져 있으면 아래 configure-pages 가 "Not Found" 라는 알아보기 어려운
      # 오류로 죽습니다. 무엇을 해야 하는지 먼저 또박또박 알려 주고 멈춥니다.
      - name: Pages 설정 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages 가 켜져 있습니다. 배포를 진행합니다."
          else
            cat <<'MSG'
          ────────────────────────────────────────────────────────────────
           GitHub Pages 가 아직 켜져 있지 않습니다.

           워크플로 토큰에는 저장소 설정을 바꿀 권한이 없어서 자동으로 켤 수
           없습니다. 저장소 주인이 한 번만 해 주면 그다음부터는 전부 자동입니다.

             Settings → Pages → Build and deployment → Source
               "GitHub Actions" 선택

           그리고 이 워크플로를 다시 실행하세요.
             Actions → "사이트 배포 (GitHub Pages)" → Run workflow

           (Actions 를 쓰지 않고 "Deploy from a branch" 로 main / docs 를 골라도
            사이트는 뜹니다. 다만 그 경우 이 워크플로는 필요 없습니다.)
          ────────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: docs/ 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
