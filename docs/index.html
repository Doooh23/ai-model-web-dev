<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI MODEL LAB — 나스닥 AI 모델 비교</title>
<meta name="description" content="여러 AI 모델로 나스닥 주가를 예측·모의투자해 보고, 어떤 모델이 어떤 상황에 적합한지 점수로 비교하는 교육용 사이트.">
<meta name="theme-color" content="#0f1218">
<meta property="og:type" content="website">
<meta property="og:title" content="AI MODEL LAB — 나스닥 AI 모델 비교">
<meta property="og:description" content="여러 AI 모델에게 똑같은 문제를 내고, 어떤 모델이 어떤 상황에 적합한지 점수로 비교합니다. 고등학생을 위한 교육용 사이트.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233f5fe0'/><text x='16' y='22' font-size='14' font-weight='700' font-family='system-ui,sans-serif' fill='white' text-anchor='middle'>AI</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">

  <!-- 왼쪽 세로 내비게이션. 0→7 학습 순서가 위에서 아래로 흐릅니다. -->
  <aside class="side">
    <div class="brand">
      <span class="brand-mark">AI</span>
      <span class="brand-txt">AI MODEL LAB<em>나스닥 AI 모델 비교 실험실</em></span>
    </div>

    <nav class="steps" id="nav">
      <span class="step-grp">시작</span>
      <button class="step on" data-screen="home"><b>0</b><span>시작</span></button>

      <span class="step-grp">준비</span>
      <button class="step" data-screen="models"><b>1</b><span>모델 도감</span></button>
      <button class="step" data-screen="universe"><b>2</b><span>종목 선정</span></button>

      <span class="step-grp">실험</span>
      <button class="step" data-screen="lab"><b>3</b><span>학습 실험실</span></button>
      <button class="step" data-screen="trade"><b>4</b><span>모의투자</span></button>
      <button class="step" data-screen="regime"><b>5</b><span>국면 분석</span></button>

      <span class="step-grp">결론</span>
      <button class="step" data-screen="score"><b>6</b><span>종합 점수표</span></button>
      <button class="step" data-screen="learn"><b>7</b><span>배우기</span></button>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="mast-meta" id="mastmeta"></div>
    </header>

    <main class="page" id="main">
      <div class="wrap">
        <div id="boot">
          <span class="spinner"></span>
          <span class="small" style="margin-left:9px">시장 데이터를 불러오는 중…</span>
        </div>
        <div id="stephint"></div>
        <div id="screen"></div>
      </div>
    </main>

    <footer class="foot">
      <div class="wrap" id="statusbar"></div>
    </footer>
  </div>

</div>

<!-- 공통 도구 -->
<script src="js/core/util.js"></script>
<script src="js/core/metrics.js"></script>
<script src="js/core/charts.js"></script>
<script src="js/core/ml.js"></script>
<script src="js/core/md.js"></script>
<script src="js/glossary.js"></script>
<script src="js/core/tips.js"></script>

<!-- 데이터 (features.js 가 로드 시점에 참조하므로 반드시 먼저) -->
<script src="js/data.js"></script>

<!-- 모델 레이어: 피처 → 분할 → 등록부 → 모델 구현 → 사전학습 결과 -->
<script src="js/features.js"></script>
<script src="js/splits.js"></script>
<script src="js/registry.js"></script>
<script src="js/core/ml_lite.js"></script>
<script src="js/core/vol.js"></script>
<script src="js/core/regime.js"></script>
<script src="js/predictions.js"></script>

<!-- 종목 선정 규칙 (2번 화면과 학습 실험실이 함께 씁니다) -->
<script src="js/universe.js"></script>

<!-- 평가 레이어: 실험 실행 → 채점·통계 검정 -->
<script src="js/experiment.js"></script>
<script src="js/score.js"></script>

<!-- 화면 -->
<script src="js/app.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/models.js"></script>
<script src="js/screens/universe.js"></script>
<script src="js/screens/lab.js"></script>
<script src="js/screens/trade.js"></script>
<script src="js/screens/regime.js"></script>
<script src="js/screens/score.js"></script>
<script src="js/screens/learn.js"></script>
<script src="js/screens/guide.js"></script>
<script>QL.App.boot();</script>
</body>
</html>
